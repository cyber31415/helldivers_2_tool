// PERSISTENCE: the app saves through `window.storage`, which the Claude artifact host provides but
// a plain browser does NOT. On GitHub Pages that object was simply undefined, and because every
// call site is wrapped in try/catch the failure was silent — the app looked like it just forgot
// your settings on refresh. This shim backs the same API with localStorage when the host object is
// absent, so a published page persists per-browser for whoever opens it.
//
// It must match the host contract exactly: get(key) resolves to { value: <string> } or null (the
// loader tests `r?.value` before parsing), and set(key, value) takes an already-stringified value.
if (typeof window !== "undefined" && !window.storage) {
  window.storage = {
    get: async key => {
      try {
        const value = window.localStorage.getItem(key);
        return value === null ? null : {
          value
        };
      } catch {
        return null;
      } // private mode / storage disabled
    },
    set: async (key, value) => {
      try {
        window.localStorage.setItem(key, String(value));
      } catch {}
    }
  };
}
