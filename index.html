// ARCHITECTURE: "MY UNLOCKS" is the ONE tab with checkboxes. Loadout and Stratagems are each a
// single blended list — no Co-op/Solo split — since a solo-viable pick is generally fine in
// co-op too; any mode-specific nuance lives in the item's note rather than a separate score.
// Both have an archetype/type filter dropdown so you can browse a specific category side-by-side
// rather than only seeing the top overall pick for a slot.
//
// CONFIDENCE SYSTEM: hard number (patch notes/wiki fact)   unverified in field
// Grade confidence is a `sources` count (how many named independent sources back that grade),
// displayed as a colored badge: green (2+ Sources) = genuinely corroborated, yellow (1 Source)
// = single reference, orange (Calculated Rating Only) = derived from real specs/mechanics with
// no tier-list backing found. Standardized grade scale, single letter + optional "+": S+ S A+ A
// B+ B C+ C D — no double letters.
//
// SOURCE-INDEPENDENCE RULE: a source only counts if it's not derivative of another one already
// counted — a site that scrapes its numbers from another tier list and republishes them isn't
// a second opinion. A single very old, unmaintained forum post ranking weapons is excluded
// entirely, since it contradicts current data on several items. Zero-source (orange) items are

//
